name: Bounded final photo continuity natural route coverage without forced layout
on:
  push:
    branches: [audit/late-travel-evidence-20261016]
    paths: [.github/workflows/release-grammar-policy-v2-photo-route-coverage.yml]
permissions:
  contents: read
jobs:
  final-current:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        partition: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/qa/generalization/tools/
            /docs/qa/generalization/composition-recovery/grammar-policy-v2-photo-route-coverage-preregistration.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: current
          ref: d04c734bc5eb0c0c427a42a196cae3a507b89506
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd current && npm ci && npm run build
      - name: Strict identity verifier counterexamples
        run: python qa/docs/qa/generalization/tools/verify_current23_inputs_test.py
      - name: Frozen case partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          mkdir -p results
          python - <<'PY'
          import json,os
          p='qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-photo-route-coverage-preregistration.json'
          d=json.load(open(p));assert len(d['fixtures'])==3
          cases=[f['id'] for i,f in enumerate(d['fixtures']) if i%3==int(os.environ['PARTITION'])]
          priority=['development-15','holdout-01','holdout-12','development-03','development-05','development-09']
          cases.sort(key=lambda c:priority.index(c) if c in priority else len(priority))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('KAMEN_MATRIX_CASES='+','.join(cases)+'\n')
          PY
          sha256sum qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-photo-route-coverage-preregistration.json qa/docs/qa/generalization/tools/matrix_late_semantic_travel.cjs > results/preregistered-tools.sha256
      - name: Complete unchanged shipping natural selection and MP4
        timeout-minutes: 330
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_MATRIX_FIXTURE_FILE: ${{ github.workspace }}/qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-photo-route-coverage-preregistration.json
          KAMEN_MATRIX_VARIANTS: v3
          KAMEN_MATRIX_NATIVE_HASHES: 1
          NODE_PATH: ${{ github.workspace }}/current/node_modules
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/matrix_late_semantic_travel.cjs http://127.0.0.1:4173/ http://127.0.0.1:4173/ results/matrix > results/matrix.log 2>&1
      - name: Full decode, final FAV and strict original input correspondence
        if: always()
        run: |
          python qa/docs/qa/generalization/tools/verify_artifacts.py results/matrix results/strict-decode.json
          python - <<'PYTHON'
          import pathlib,json
          spec=json.load(open('qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-photo-route-coverage-preregistration.json'));rows=json.load(open('results/matrix/results.json'))['rows'];find={f['id']:f for f in spec['fixtures']}
          for row in rows:
            assert row['fixture']==find[row['fixture']['id']] and row['status']=='PASS';v=row['provenance']['finalArtifactVerification'];assert v['status']=='MEASURED' and v['binding']['sourceCommit']==spec['sourceCommit'] and v['binding']['videoSHA256']==row['sha256'];assert row['directionSelectionMethod']=='SHIPPING_OPTIMIZE_DIRECTION_CANDIDATES_RENDERED'
          pathlib.Path('results/route-coverage-source-check.json').write_text(json.dumps({'sourceCommit':spec['sourceCommit'],'cases':[r['fixture']['id']for r in rows],'scope':'Normal final chosen shipping FAV/source/fixture only; target contract selection and independent realization must be inspected separately.'}))
          PYTHON
      - name: Exact adopted Native replay and actual executed intent population
        if: always()
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/dispatch-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          status=0
          IFS=',' read -ra cases <<< "$KAMEN_MATRIX_CASES"
          for case_id in "${cases[@]}"; do
            node qa/docs/qa/generalization/tools/native_dispatch_clock_bound_trace_v4.cjs http://127.0.0.1:4173/ results/matrix "$case_id" v3 "results/dispatch/$case_id" > "results/dispatch-$case_id.log" 2>&1 || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: grammar-policy-v2-photo-route-coverage-${{ matrix.partition }}
          path: results/
          retention-days: 14
