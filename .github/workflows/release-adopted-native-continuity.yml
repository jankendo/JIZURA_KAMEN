name: Frozen1aa shipping-adopted native proof and continuity ON OFF replay
on:
  push:
    branches: [codex/kamen-generalization-evidence-20261012]
    paths: [.github/workflows/release-adopted-native-continuity.yml]
permissions:
  contents: read
jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1aa31cd632955894daef8e8849728a9a0ef608c8
          path: current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd current && npm ci && npm run build
      - name: Shipping adopted output with native proof then frozen counterfactuals
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_MATRIX_NATIVE_HASHES: 1
          KAMEN_MATRIX_FIXTURE_FILE: ${{ github.workspace }}/qa/docs/qa/generalization/final-valid-preregistration.json
          KAMEN_MATRIX_CASES: supplemental-holdout-13
          KAMEN_MATRIX_VARIANTS: v3
          KAMEN_COUNTERFACTUAL_PHASES: 1
          KAMEN_COUNTERFACTUAL_NATIVE_HASHES: 1
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          mkdir -p results
          node qa/docs/qa/generalization/tools/matrix.cjs http://127.0.0.1:4173/ http://127.0.0.1:4173/ results/adopted > results/adopted.log 2>&1
          python qa/docs/qa/generalization/tools/verify_artifacts.py results/adopted results/strict-decode.json
          for hook in temporalCinemaFocus drawCinemaAccent; do
            mkdir -p "results/$hook"
            KAMEN_COUNTERFACTUAL_HOOK="$hook" node qa/docs/qa/generalization/tools/encoded_camera_counterfactual.cjs http://127.0.0.1:4173/ results/adopted supplemental-holdout-13 v3 current "results/$hook" > "results/$hook/run.log" 2>&1
          done
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: release1aa-adopted-native-continuity
          path: |
            results
            server.log
          retention-days: 14
          if-no-files-found: error
