name: Bounded minimal-metadata transport pilot with immutable original FAV retained on collector
on:
  push:
    branches: [audit/late-travel-evidence-20261016]
    paths: [.github/workflows/release-grammar-policy-v2-original-fav-transport-pilot.yml]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/qa/generalization/tools/
            /docs/qa/generalization/composition-recovery/grammar-policy-v2-original-fav-reuse-pilot.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: current
          ref: d04c734bc5eb0c0c427a42a196cae3a507b89506
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd current && npm ci && npm run build
      - name: Exact original artifact, unchanged measured certificate and helper counterexamples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results original
          node qa/docs/qa/generalization/tools/pack_original_counterfactual_metadata_test.cjs
          python qa/docs/qa/generalization/tools/run_bounded_diagnostic_test.py
          python - <<'PYTHON'
          import pathlib,json,subprocess,hashlib,zipfile,os
          spec=json.load(open('qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-original-fav-reuse-pilot.json'));a=spec['original']
          with open('original.zip','wb')as f:subprocess.run(['gh','api',f"repos/jankendo/JIZURA_KAMEN/actions/artifacts/{a['artifactId']}/zip"],stdout=f,check=True)
          assert hashlib.sha256(pathlib.Path('original.zip').read_bytes()).hexdigest()==a['archiveSHA256']
          with zipfile.ZipFile('original.zip')as z:
            assert all(not pathlib.PurePosixPath(n).is_absolute()and '..'not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall('original')
          pathlib.Path('results/original-binding.json').write_text(json.dumps(spec))
          with open(os.environ['GITHUB_ENV'],'a')as f:f.write('CONTROL_CASE='+spec['caseId']+'\n')
          PYTHON
      - name: Fresh Native and three diagnostic encodes with bounded stage logs
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_COUNTERFACTUAL_PHASES: 1
          KAMEN_COUNTERFACTUAL_NATIVE_HASHES: 1
          KAMEN_COUNTERFACTUAL_HOOK: cameraAt
          KAMEN_CURRENT_NATIVE_TRACE: ${{ github.workspace }}/results/native/native-dispatch-trace.json
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          python qa/docs/qa/generalization/tools/run_bounded_diagnostic.py results/native-run.json 600 results/native.log node qa/docs/qa/generalization/tools/native_dispatch_lineage_trace_v7.cjs http://127.0.0.1:4173/ original/matrix "$CONTROL_CASE" v3 results/native
          node qa/docs/qa/generalization/tools/original_verification_reuse_test.cjs "original/matrix/$CONTROL_CASE-v3-row.json" results/native/native-dispatch-trace.json > results/original-reuse-counterexamples.log
          python qa/docs/qa/generalization/tools/run_bounded_diagnostic.py results/baseline-run.json 1200 results/baseline.log node qa/docs/qa/generalization/tools/encoded_selected_operator_controls_reuse_original.cjs http://127.0.0.1:4173/ original/matrix "$CONTROL_CASE" v3 current results/baseline
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: grammar-policy-v2-original-fav-transport-pilot
          path: results/
          retention-days: 14
