name: Diagnose original-source font resources and raster environment without encoding
on:
  push:
    branches: [codex/release-evidence-recovery-20261019]
    paths: [.github/workflows/recovery-font-environment.yml]
permissions:
  contents: read
jobs:
  raster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout: docs/qa/generalization/tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: original
          ref: d04c734bc5eb0c0c427a42a196cae3a507b89506
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: original/package-lock.json
      - run: cd original && npm ci && npm run build
      - name: Observe loaded font bytes and actual glyph pixels
        env:
          NODE_PATH: ${{ github.workspace }}/original/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          node original/scripts/serve.mjs dist 127.0.0.1 4173 > /tmp/font-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/probe_font_raster_environment.cjs http://127.0.0.1:4173/ results
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: recovery-original-font-environment
          path: results/
          retention-days: 14
