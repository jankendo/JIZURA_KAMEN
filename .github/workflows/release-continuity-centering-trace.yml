name: Native causal trace of continuity and photo centering
on:
  push:
    branches: [codex/kamen-generalization-evidence-20261012]
    paths: [.github/workflows/release-continuity-centering-trace.yml]
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/qa/generalization/tools/
            /docs/qa/generalization/composition-recovery/temporal-continuity-component-preregistration.json
            /docs/qa/generalization/composition-recovery/final-source-current23-4/
            /docs/qa/generalization/media/4eed413aec8318204067f15b792fce1696019210d3661e3c96ac5dff95f2892d.wav
            /docs/qa/generalization/media/a01ca609476c9c5ef4c1b5eaae04231c2a38802e32d4ecd47870f7e841539c9b.mp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b002cdd75845d189221312a82456c33a131f5e8d
          path: current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd current && npm ci && npm run build
      - name: Component isolation counterexamples
        run: node qa/docs/qa/generalization/tools/temporal_continuity_component_test.cjs
      - name: Restore exact adopted artifact without planning
        run: |
          python qa/docs/qa/generalization/tools/restore_canonical_artifact.py qa/docs/qa/generalization final-source-current23-4 restored --prefix matrix/supplemental-holdout-13-v3
          python qa/docs/qa/generalization/tools/restore_canonical_artifact.py qa/docs/qa/generalization final-source-current23-4 restored --prefix matrix/results.json
      - name: Frozen adopted typography ON OFF ON_REPEAT
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_COUNTERFACTUAL_PHASES: 1
          KAMEN_COUNTERFACTUAL_NATIVE_HASHES: 1
        run: |
          mkdir -p results
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/trace_continuity_centering.cjs http://127.0.0.1:4173/ restored/matrix current results > results/trace.log 2>&1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: fresh30-continuity-centering-native-trace
          path: results
          retention-days: 14
          if-no-files-found: error
