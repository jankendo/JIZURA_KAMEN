name: Immutable main MP4 observer controls (PCM mismatch stays visual-only)
on:
  push:
    branches: [codex/kamen-generalization-evidence-20261012]
    paths: [.github/workflows/release-common-observer-confirmation.yml]
permissions:
  contents: read
jobs:
  same-video-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        fixture: [development-07, supplemental-development-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5c92e27e6216962d09ec73927fd0df6ce50d0560
          path: current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Build fixed observer without encoding any movie
        run: |
          (cd current && npm ci && npm run build)
          test -x /usr/bin/google-chrome
          mkdir -p results
          git -C current rev-parse HEAD > results/observer-source.txt
          sha256sum current/dist/index.html qa/docs/qa/generalization/composition-recovery/quality-comparison-tools/common_observer_confirmation.cjs > results/observer-and-tool.sha256
      - name: Restore and hash-check immutable main video reference and source audio
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          python qa/docs/qa/generalization/composition-recovery/quality-comparison-tools/restore_observer_confirmation.py qa/docs/qa/generalization "$FIXTURE" inputs
          cp inputs/restore-manifest.json results/restore-manifest.json
      - name: Decode the exact same completed MP4 twice using fixed observer
        timeout-minutes: 85
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          FIXTURE: ${{ matrix.fixture }}
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4173/
          failed=0
          for repeat in 1 2; do
            mkdir -p "results/repeat-$repeat"
            if node qa/docs/qa/generalization/composition-recovery/quality-comparison-tools/common_observer_confirmation.cjs http://127.0.0.1:4173/ inputs "results/repeat-$repeat" > "results/repeat-$repeat/observer.log" 2>&1; then
              echo PASS > "results/repeat-$repeat/process-status.txt"
            else
              echo FAIL > "results/repeat-$repeat/process-status.txt"
              failed=1
            fi
          done
          if ! python qa/docs/qa/generalization/composition-recovery/quality-comparison-tools/summarize_observer_confirmation.py results "$FIXTURE"; then failed=1; fi
          exit "$failed"
      - name: Preserve observations and every failed attempt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-common-observer5c92-${{ matrix.fixture }}
          path: results/
          retention-days: 14
          if-no-files-found: error
