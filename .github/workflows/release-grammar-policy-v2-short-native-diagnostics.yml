name: Collect blocked short-profile OFF diagnostics without weakening reproduction guard
on:
  push:
    branches: [audit/late-travel-evidence-20261016]
    paths: [.github/workflows/release-grammar-policy-v2-short-native-diagnostics.yml]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        key: [4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/qa/generalization/tools/
            /docs/qa/generalization/composition-recovery/grammar-policy-v2-short-native-diagnostic-preregistration.json
            /docs/qa/generalization/composition-recovery/grammar-policy-v2-temporal-recipe-preregistration.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: current
          ref: d04c734bc5eb0c0c427a42a196cae3a507b89506
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd current && npm ci && npm run build
      - name: Original failed baseline bundle and unchanged strict guard counterexamples
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_KEY: ${{ matrix.key }}
        run: |
          mkdir -p results cached
          python - <<'PYTHON'
          import pathlib,zipfile,hashlib,json,subprocess,os
          spec=json.load(open('qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-short-native-diagnostic-preregistration.json'));c=next(x for x in spec['cases']if x['key']==os.environ['CONTROL_KEY'])
          with open('cached.zip','wb')as f:subprocess.run(['gh','api',f"repos/jankendo/JIZURA_KAMEN/actions/artifacts/{c['artifactId']}/zip"],stdout=f,check=True)
          assert hashlib.sha256(pathlib.Path('cached.zip').read_bytes()).hexdigest()==c['archiveSHA256']
          with zipfile.ZipFile('cached.zip')as z:
            assert all(not pathlib.PurePosixPath(n).is_absolute()and '..'not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall('cached')
          pathlib.Path('results/original-binding.json').write_text(json.dumps(c))
          with open(os.environ['GITHUB_ENV'],'a')as f:f.write('CONTROL_CASE='+c['caseId']+'\n')
          PYTHON
          CONTROL_CASE=$(python -c 'import json; print(json.load(open("results/original-binding.json"))["caseId"])')
          test -n "$CONTROL_CASE"
          node qa/docs/qa/generalization/tools/native_only_diagnostic_baseline_test.cjs cached/inputs/original/matrix "$CONTROL_CASE" "cached/cases/$CONTROL_CASE/baseline" > results/guard-counterexamples.log
      - name: Fresh Native then only ten predeclared OFFs with explicit no-release-credit flags
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_COUNTERFACTUAL_PHASES: 1
          KAMEN_COUNTERFACTUAL_NATIVE_HASHES: 1
          KAMEN_GRAMMAR_CONTROL_SPEC: ${{ github.workspace }}/qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-temporal-recipe-preregistration.json
          CONTROL_KEY: ${{ matrix.key }}
        run: |
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/native_dispatch_lineage_trace_v7.cjs http://127.0.0.1:4173/ cached/inputs/original/matrix "$CONTROL_CASE" v3 results/native > results/native.log 2>&1
          python - <<'PYTHON'
          import json,pathlib,subprocess,os
          spec=json.load(open('qa/docs/qa/generalization/composition-recovery/grammar-policy-v2-short-native-diagnostic-preregistration.json'));c=next(x for x in spec['cases']if x['key']==os.environ['CONTROL_KEY']);root=pathlib.Path.cwd();env={**os.environ,'KAMEN_REUSE_BASELINE_REPORT':str(root/'cached/cases'/c['caseId']/'baseline/effect-counterfactual-report.json'),'KAMEN_CURRENT_NATIVE_TRACE':str(root/'results/native/native-dispatch-trace.json')};rows=[]
          for i,hook in enumerate(c['hooks']):
            out=root/'results/controls'/str(i);out.mkdir(parents=True);env['KAMEN_COUNTERFACTUAL_HOOK']=hook
            with open(root/'results'/('off-'+str(i)+'.log'),'w')as f:r=subprocess.run(['node','qa/docs/qa/generalization/tools/encoded_selected_operator_off_native_diagnostic.cjs','http://127.0.0.1:4173/','cached/inputs/original/matrix',c['caseId'],'v3','current',str(out)],env=env,stdout=f,stderr=subprocess.STDOUT)
            rows.append({'hook':hook,'exitCode':r.returncode,'permitReleaseCredit':False})
          pathlib.Path('results/diagnostic-collection.json').write_text(json.dumps({'sourceCommit':spec['sourceCommit'],'caseId':c['caseId'],'rows':rows,'scope':'No automatic release or semantic credit; decoded reproduction mismatch remains false.'},indent=2));assert all(x['exitCode']==0 for x in rows)
          PYTHON
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: grammar-policy-v2-short-native-diagnostic-${{ matrix.key }}
          path: results/
          retention-days: 14
