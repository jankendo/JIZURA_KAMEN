name: Recovery 32 frozen films exact Native continuity to final observer fix
on:
  push:
    branches: [codex/release-evidence-recovery-20261019]
    paths: [.github/workflows/recovery-source-native32.yml]
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [development-01, development-02, development-03, development-04, development-05, development-06, development-07, development-08, development-09, development-10, development-11, development-12, development-14, development-15, holdout-01, holdout-02, holdout-03, holdout-04, holdout-05, holdout-06, holdout-07, holdout-08, holdout-09, holdout-10, holdout-11, holdout-12, holdout-14, holdout-15, supplemental-development-13, supplemental-holdout-13, automatic-unseen-confirmation-20261018, late-unseen-quiet-16x9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/qa/generalization/tools/
            /docs/qa/generalization/composition-recovery/release-recovery-20261019/current31-results/${{ matrix.case }}/matrix/*.json.gz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: current
          ref: 0a5c896fcf1a734b4f18d3f2467c285ba7c6a1fc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Authenticate original source objects and build final source
        run: |
          git -C current fetch origin 5eb02e6fba86c2104711894dc894b461d2fae922 --depth=1
          cd current
          npm ci
          npm run build
      - name: Every adopted frame, exact original Native RGBA, no encoding
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_EXPECTED_CURRENT_SOURCE: 0a5c896fcf1a734b4f18d3f2467c285ba7c6a1fc
          KAMEN_CURRENT_REPOSITORY: ${{ github.workspace }}/current
          CONTROL_CASE: ${{ matrix.case }}
        run: |
          mkdir -p results
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in {1..30}; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/verify_recovery_native_source_continuity.cjs http://127.0.0.1:4173 "qa/docs/qa/generalization/composition-recovery/release-recovery-20261019/current31-results/$CONTROL_CASE/matrix" "$CONTROL_CASE" v3 results > results/replay.log 2>&1
      - name: Preserve source-bound observations
        if: always()
        run: |
          python - <<'PY'
          import pathlib,gzip
          for p in pathlib.Path('results').rglob('*.json'):
              p.with_name(p.name+'.gz').write_bytes(gzip.compress(p.read_bytes(),mtime=0));p.unlink()
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: recovery-source-native32-${{ matrix.case }}
          path: results/
          retention-days: 14
