name: Repackage immutable successful validation artifact
on:
  push:
    branches: [codex/release-evidence-recovery-20261019]
    paths: [.github/workflows/recovery-validation-artifact.yml]
permissions:
  contents: read
  actions: read
jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: kamen-validation
          run-id: 39220369311
          github-token: ${{ github.token }}
          path: validation
      - name: Preserve file hashes and package existing bytes only
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,tarfile
          root=pathlib.Path('validation')
          files=sorted(p for p in root.rglob('*') if p.is_file())
          records=[{'path':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
          pathlib.Path('inventory.json').write_text(json.dumps({'runId':39220369311,'sourceCommit':'5eb02e6fba86c2104711894dc894b461d2fae922','files':records},indent=2)+'\n')
          with tarfile.open('validation.tar.gz','w:gz') as t:
              t.add(root,arcname='validation');t.add('inventory.json')
          with open('validation.tar.gz','rb') as f:
              index=0
              while chunk:=f.read(180*1024*1024):
                  pathlib.Path(f'validation-part-{index:03d}').write_bytes(chunk);index+=1
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: validation-inventory
          path: inventory.json
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: validation-part-000
          path: validation-part-000
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: validation-part-001
          path: validation-part-001
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: validation-part-002
          path: validation-part-002
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: validation-part-003
          path: validation-part-003
          if-no-files-found: ignore
          retention-days: 7
