name: Publish certified KAMEN

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Approved exact main SHA (dispatch authorizes production publication)'
        required: true
        type: string
      evidence_run_id:
        description: 'Successful same-SHA run containing kamen-release-evidence/manifest.json'
        required: true
        type: string
      manifest_sha256:
        description: 'Reviewed SHA-256 of manifest.json'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Check out approved source and correspondence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check approval and evidence producer
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: node dev/pages_release.cjs producer
      - name: Download reviewed evidence (data only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kamen-release-evidence
          path: ${{ runner.temp }}/kamen-release-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Set up final media verification
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build approved production files
        run: npm ci && npm run build
      - name: Verify actual release evidence and latest candidate
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          EVIDENCE_ROOT: ${{ runner.temp }}/kamen-release-evidence
          RELEASE_REPORT: ${{ runner.temp }}/kamen-release-result.json
        run: node dev/pages_release.cjs verify
      - name: Preserve release decision
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kamen-release-decision
          path: ${{ runner.temp }}/kamen-release-result.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload certified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Reject stale main before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node dev/pages_release.cjs current
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify published HTTPS source
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          node <<'JS'
          (async () => {
            const url = new URL(process.env.PAGES_URL);
            if (url.protocol !== 'https:') throw Error('Pages must use HTTPS');
            url.searchParams.set('release_sha', process.env.APPROVED_SHA);
            for (let attempt = 0; attempt < 6; attempt++) {
              const response = await fetch(url, {signal: AbortSignal.timeout(15000)});
              const html = await response.text();
              const match = html.match(/window\.KAMEN_BUILD_INFO=Object\.freeze\((\{[^\n]*?\})\)/);
              const info = match && JSON.parse(match[1]);
              if (response.ok && info?.sourceCommit === process.env.APPROVED_SHA && info.sourceDirty === false) {
                console.log(`HTTPS source verified: ${info.sourceCommit}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw Error('Published HTTPS page did not match approved clean source');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS
