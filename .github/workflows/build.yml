name: Validate and deploy KAMEN
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and media tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Current browser contracts
        env:
          JIZURA_TEST_SUMMARY: ${{ runner.temp }}/kamen-browser-qa/unit.json
        run: |
          mkdir -p "$RUNNER_TEMP/kamen-browser-qa"
          npm test
      - name: Build and verify distribution
        run: |
          npm run build:media
          npm run build
          cmp index.html dist/index.html
          test -f dist/LICENSE
          test -f dist/OFL.txt
          test -f dist/LICENSE.JIZURA.txt
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/licenses/FFmpeg-LGPL-2.1.txt
      - name: Browser UX, migration, storage and decoded media
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_QA_OUT: ${{ runner.temp }}/kamen-browser-qa
          KAMEN_LONG_EXPORT: '1'
        run: npm run test:e2e
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kamen-browser-qa
          path: ${{ runner.temp }}/kamen-browser-qa
          retention-days: 7
      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
