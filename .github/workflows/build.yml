name: Validate and deploy KAMEN

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check changed JavaScript syntax
        run: |
          for file in src/11zzzzzzzzzw_credits.js dev/credits_layout_e2e.cjs src/11zzzzzzzzzu_random_workflow_v16.js dev/kamen_random_v16_test.cjs dev/kamen_random_v16_scale.cjs dev/kamen_random_v16_recovery.cjs src/11zzzzzzzzzt_random_finisher_v15.js dev/kamen_random_v15_checks.cjs src/11zzzzzzzzzs_motion_led_v14.js dev/kamen_motion_v14_checks.cjs src/11zzzzzzzzzr_exploration_director_v13.js dev/kamen_exploration_v13_checks.cjs src/11zzzzzzzzzq_safe_alternatives_v112.js dev/kamen_safe_alternative_v112_scenario.cjs src/11zzzzzzzzzp_persistence_v111.js dev/kamen_persistence_v111_fast_test.cjs src/08_planner.js dev/kamen_song_native_v11_asset_scenario.cjs src/11zzzzzzzzzo_song_derived_direction_v11.js dev/kamen_song_native_v11_fast_test.cjs dev/kamen_song_native_v11_scenarios.cjs src/11zzzzzzzzzn_creative_optimizer_v10.js dev/kamen_song_native_v10_fast_test.cjs src/11zzzzzzzzzm_selection_integrity_v9.js dev/kamen_song_native_v9_fast_test.cjs src/06_layouts.js src/11zzzzzzzzzl_jizura_direction_v8.js dev/kamen_song_native_v8_fast_test.cjs src/11zzi_render_selection.js src/09_render.js src/11zzzzzzzzzk_song_composition_v7.js dev/kamen_song_native_v7_fast_test.cjs src/01p_processing.js src/12a_processing_ui.js src/11w_observer_director.js src/11zzq_render_feedback.js src/10_audio.js src/11s_hype_engine.js src/11zzl_song_direction.js src/11zzzzzzzzzg_song_grammar_v5.js src/11zzzzzzzzzh_song_grammar_quality_v5.js src/11zzzzzzzzzi_song_grammar_social_v5.js dev/kamen_song_native_v5_fast_test.cjs src/11zzzzzzzzzj_song_grammar_v6.js dev/kamen_song_native_v6_fast_test.cjs src/11zzzzzzzzzf_song_grammar_v4.js dev/kamen_song_native_v4_fast_test.cjs src/11zzzzzzzzze_song_native_director.js src/11zzm_story_director.js src/11zzzzzz_video_search.js src/11zzzzzzzz_cinema_v3.js src/12_ui.js scripts/build.mjs dev/kamen_song_native_director_test.cjs dev/kamen_song_native_v3_fast_test.cjs dev/browser_startup_smoke.cjs; do
            node --check "$file"
          done
      - name: Check random-first v15 in Chrome
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_V12_COMPARE: v15
          KAMEN_V15_CHECKS: '1'
        run: node dev/kamen_song_native_v11_fast_test.cjs
      - name: Check selected-draft v16 scale recovery in Chrome
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_V12_COMPARE: v15
          KAMEN_V16_CHECKS: '1'
        run: node dev/kamen_song_native_v11_fast_test.cjs
      - name: Check motion-led v14 in Chrome
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_V12_COMPARE: v14
          KAMEN_V14_CHECKS: '1'
        run: node dev/kamen_song_native_v11_fast_test.cjs
      - name: Check exploration first v13 in Chrome
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
          KAMEN_V12_COMPARE: v13
          KAMEN_V13_CHECKS: '1'
        run: node dev/kamen_song_native_v11_fast_test.cjs
      - name: Check song-derived direction v11 in Chrome
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
        run: node dev/kamen_song_native_v11_fast_test.cjs
      - name: Check creative optimizer v10 contracts
        run: node dev/kamen_song_native_v10_fast_test.cjs
      - name: Check selection integrity v9 contracts
        run: node dev/kamen_song_native_v9_fast_test.cjs
      - name: Check JIZURA direction v8 contracts
        run: node dev/kamen_song_native_v8_fast_test.cjs
      - name: Check Song Causal Composition v7 contracts
        run: node dev/kamen_song_native_v7_fast_test.cjs
      - name: Check Acoustic Trajectory v6 contracts
        run: node dev/kamen_song_native_v6_fast_test.cjs
      - name: Check Song-Generated Visual Grammar v5 contracts
        run: node dev/kamen_song_native_v5_fast_test.cjs
      - name: Check Song-Generated Visual Grammar v4 contracts
        run: node dev/kamen_song_native_v4_fast_test.cjs
      - name: Check Song-Native v3 contracts
        run: node dev/kamen_song_native_v3_fast_test.cjs
      - name: Check export UI behavior
        run: node dev/kamen_export_ui_test.cjs
      - name: Validate streaming writes and encoder lifecycle
        run: |
          node dev/mp4_block_store_test.mjs
          node dev/upstream_export_regression_test.js
          node dev/kamen_encoder_liveness_test.cjs
      - name: Build production files
        run: npm run build:media && npm run build
      - name: Verify production layout
        run: |
          cmp index.html dist/index.html
          test -f dist/LICENSE
          test -f dist/OFL.txt
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/licenses/FFmpeg-LGPL-2.1.txt
          ! grep -q 'jizura-custom-background.jankendo14.chatgpt.site' dist/index.html
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  mp4-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production media and application
        run: npm run build:media && npm run build
      - name: Install MP4 verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version
      - name: Browser startup smoke test
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          node scripts/serve.mjs dist 127.0.0.1 4173 > "$RUNNER_TEMP/kamen-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/upstream-qa"
          node dev/kamen_persistence_v111_fast_test.cjs http://127.0.0.1:4173/
          node dev/browser_startup_smoke.cjs http://127.0.0.1:4173/
          node dev/workspace_conflicts_e2e.cjs http://127.0.0.1:4173/ "$RUNNER_TEMP/upstream-qa/workspaces.json"
          node dev/credits_layout_e2e.cjs http://127.0.0.1:4173/ "$RUNNER_TEMP/upstream-qa/credits"
          KAMEN_LONG_EXPORT=1 node dev/upstream_modernization_e2e.cjs http://127.0.0.1:4173/ "$RUNNER_TEMP/upstream-qa"
      - name: Upload MP4 verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-mp4-qa
          path: ${{ runner.temp }}/upstream-qa
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, mp4-validation]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
