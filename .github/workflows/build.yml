name: FAST CI and deploy KAMEN

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check changed JavaScript syntax
        run: |
          for file in src/11zzzzzzzzze_song_native_director.js src/11zzm_story_director.js src/11zzzzzz_video_search.js src/11zzzzzzzz_cinema_v3.js src/12_ui.js scripts/build.mjs dev/kamen_song_native_director_test.cjs dev/kamen_song_native_v3_fast_test.cjs; do
            node --check "$file"
          done
      - name: Check Song-Native v3 contracts
        run: node dev/kamen_song_native_v3_fast_test.cjs
      - name: Check export UI behavior
        run: node dev/kamen_export_ui_test.cjs
      - name: Build production files
        run: npm run build
      - name: Verify production layout
        run: |
          cmp index.html dist/index.html
          test -f dist/LICENSE
          test -f dist/OFL.txt
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/licenses/FFmpeg-LGPL-2.1.txt
          ! grep -q 'jizura-custom-background.jankendo14.chatgpt.site' dist/index.html
      - name: Browser startup smoke test
        env:
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          node scripts/serve.mjs dist 127.0.0.1 4173 > "$RUNNER_TEMP/kamen-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node dev/browser_startup_smoke.cjs http://127.0.0.1:4173/
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
