      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b002cdd75845d189221312a82456c33a131f5e8d
          path: current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: cd current && npm ci && npm run build
      - name: Restore hash-bound selected inputs and trace every native frame
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          mkdir -p results
          python audit/docs/qa/generalization/tools/prepare_bound_native_population.py qa/docs/qa/generalization ${{ matrix.chunk }} results
          echo development-09 > results/fixtures.txt
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          while read -r fixture; do
            node audit/docs/qa/generalization/tools/native_dispatch_font_diagnostic.cjs http://127.0.0.1:4173/ "results/inputs/$fixture/matrix" "$fixture" v3 "results/traces/$fixture" > "results/$fixture.log" 2>&1
          done < results/fixtures.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: development09-bound-native-font-diagnostic
          path: results/traces
          retention-days: 14
          if-no-files-found: error
