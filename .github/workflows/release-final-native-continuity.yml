name: Release9f805e exact adopted native continuity
on:
  push:
    branches: [codex/kamen-generalization-evidence-20261012]
    paths: [.github/workflows/release-final-native-continuity.yml]
permissions:
  contents: read
jobs:
  native-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case: ['01', '02']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qa
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9f805e269e1e34ffb232117a5cb19a699ae0b94d
          path: current
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: cd current && npm ci && npm run build
      - name: Restore exact adopted artifact without planning
        run: python qa/docs/qa/generalization/tools/restore_canonical_artifact.py qa/docs/qa/generalization supplement5c92-${{ matrix.case }} restored
      - name: Compare all original adopted Native frames to release source
        env:
          NODE_PATH: ${{ github.workspace }}/current/node_modules
          KAMEN_CHROME: /usr/bin/google-chrome
        run: |
          mkdir -p results
          node current/scripts/serve.mjs dist 127.0.0.1 4173 > results/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1; done
          node qa/docs/qa/generalization/tools/verify_frozen_native_source_continuity.cjs http://127.0.0.1:4173/ restored/matrix release-supplement-${{ matrix.case }} v3 results 9f805e269e1e34ffb232117a5cb19a699ae0b94d > results/run.log 2>&1
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: release9f805e-native-source-continuity-${{ matrix.case }}
          path: results
          retention-days: 14
          if-no-files-found: error
